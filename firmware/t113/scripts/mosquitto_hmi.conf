# zhishu-HMI T113 F6 测试用 mosquitto 配置
#
# 安装方法：
#   sudo install -m 644 scripts/mosquitto_hmi.conf /etc/mosquitto/conf.d/hmi.conf
#   sudo touch /etc/mosquitto/passwd
#   sudo mosquitto_passwd -b /etc/mosquitto/passwd hmi hmi123
#   sudo systemctl restart mosquitto
#
# 主配置 /etc/mosquitto/mosquitto.conf 末尾必须包含：
#   include_dir /etc/mosquitto/conf.d
# 否则本文件不会被加载（mosquitto 2.x 默认不包含 conf.d）

# 监听所有网卡的 1883 端口
listener 1883 0.0.0.0

# 禁止匿名访问
allow_anonymous false

# 密码文件路径
password_file /etc/mosquitto/passwd

# 日志输出到文件（需确保 /var/log/mosquitto/ 存在且 mosquitto 用户可写）
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
