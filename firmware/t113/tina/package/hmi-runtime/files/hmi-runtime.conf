# zhishu-HMI 运行时配置（参考）
# 注：runtime_config.h 为编译期配置（按 HMI_BOARD_WAVEPI 宏切换）；本文件为运行时说明与运维记录。
# 修改编译期配置后需重新打包镜像。
# 目标板（HMI_BOARD_WAVEPI）：
#   mq_r（=0）：调试 /dev/ttyS1，RS485 /dev/ttyS3（UART3 硬件 RS485）
#   WavePI-S6 7 寸（=1）：调试 /dev/ttyS3（UART3→CH340E），RS485 /dev/ttyS4（UART4→SP485，DE/RE=PG8）

# 触摸节点（电容 event2 / 电阻 event0）
HMI_TOUCH_DEV=/dev/input/event2

# Modbus RTU RS485（WavePI-S6 = /dev/ttyS4）
HMI_MBUS_RTU_DEV=/dev/ttyS4
HMI_MBUS_RTU_BAUD=9600

# Modbus TCP
HMI_MBUS_TCP_HOST=192.168.100.10
HMI_MBUS_TCP_PORT=502

# MQTT 代理
HMI_MQTT_HOST=192.168.100.10
HMI_MQTT_PORT=1883
HMI_MQTT_TOPIC_PREFIX=hmi/t113
